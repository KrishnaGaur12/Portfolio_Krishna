<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishnaG</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'space-cadet': '#25344F',
              'slate-gray': '#617891',
              'tan': '#D5B893',
              'coffee': '#6F4D38',
              'caput-mortuum': '#632024',
              cream: {
                50: '#F9F7F2', /* Adjusted for better match with new palette */
                100: '#F0EAD6',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
              pixel: ['"Press Start 2P"', 'cursive'],
              mono: ['"Space Mono"', 'monospace'],
              jetbrains: ['"JetBrains Mono"', 'monospace'],
            },
            animation: {
              'float-slow': 'float 6s ease-in-out infinite',
              'float-medium': 'float 5s ease-in-out infinite',
              'float-fast': 'float 4s ease-in-out infinite',
              'sparkle': 'sparkle 2s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'fade-in-down': 'fadeInDown 0.8s ease-out forwards',
              'slide-in-right': 'slideInRight 0.6s ease-out forwards',
              'reveal': 'reveal 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards',
              'marquee': 'marquee 25s linear infinite',
              'pulse-glow': 'pulseGlow 2s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              sparkle: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.6', transform: 'scale(0.8) rotate(15deg)' },
              },
              fadeInUp: {
                  '0%': { opacity: '0', transform: 'translateY(20px)' },
                  '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInDown: {
                  '0%': { opacity: '0', transform: 'translateY(-20px)' },
                  '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInRight: {
                  '0%': { opacity: '0', transform: 'translateX(30px)' },
                  '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              reveal: {
                  '0%': { clipPath: 'inset(0 100% 0 0)' },
                  '100%': { clipPath: 'inset(0 0 0 0)' },
              },
              marquee: {
                  '0%': { transform: 'translateX(0%)' },
                  '100%': { transform: 'translateX(-100%)' },
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 10px rgba(213, 184, 147, 0)' },
                '50%': { boxShadow: '0 0 20px rgba(213, 184, 147, 0.3)' },
              }
            }
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
