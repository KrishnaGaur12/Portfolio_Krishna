<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2D6"/>
      <stop offset="75%" stop-color="#BF9B30"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle (optional, but helps visibility) -->
  <circle cx="32" cy="32" r="30" fill="#25344F" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- "KG" Text -->
  <text x="32" y="42" font-family="'Courier New', monospace" font-weight="bold" font-size="32" text-anchor="middle" fill="url(#gold)" filter="url(#glow)" letter-spacing="-2">KG</text>
</svg>